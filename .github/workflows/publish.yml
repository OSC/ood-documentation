name: Publish Html

on:
  push:
    branches: [latest, develop, release-*]
  pull_request:
    branches: [latest, develop, release-*]

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Check Spelling
        run: |
          rake spellcheck

      - name: Make Html
        run: |
          rake build

      - name: Publish to the test repo
        env:
          GITHUB_TOKEN: ${{ secrets.OSC_ROBOT_GH_PUB_REPO_TOKEN }}
          NAME: ${{ secrets.OSC_ROBOT_GH_USER }}
          USER: ${{ secrets.OSC_ROBOT_GH_USER_EMAIL }}
        run: /bin/bash push.sh "ood-documentation-test"
    
      - name: Publish to the main repo
        if: github.event_name == 'push'
        env:
          NAME: ${{ secrets.OSC_ROBOT_GH_USER }}
          USER: ${{ secrets.OSC_ROBOT_GH_USER_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.OSC_ROBOT_GH_PUB_REPO_TOKEN }}
        run: /bin/bash push.sh "ood-documentation"
